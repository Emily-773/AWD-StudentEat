<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudentEat</title>

  <!-- Glide CSS -->
  <link href="./node_modules/@glidejs/glide/dist/css/glide.core.min.css" rel="stylesheet">
  <link href="./node_modules/@glidejs/glide/dist/css/glide.theme.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body id="page-home">

  <header>
    <div class="page-header-top container text-center text-md-start">
      <a href="index.html">
        <img src="./images/logo.png" alt="StudentEat" />
      </a>
    </div>

    <nav class="navbar navbar-expand-lg mb-4">
      <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbar">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="categories.html">Categories</a>
            </li>

            <li class="nav-item">
              <a class="nav-link btn btn-primary text-white ms-lg-3 px-3" href="login.html">
                Login
              </a>
            </li>
          </ul>

          <form action="search.html" method="get" class="d-flex">
            <input class="form-control me-2" type="search" name="query" placeholder="Search recipes...">
            <button class="btn btn-outline-dark" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>
  </header>

  <div class="container mt-4">
    <div class="glide">
      <div class="glide__track" data-glide-el="track">
        <ul class="glide__slides">

          <li class="glide__slide">
            <div class="recipe-slide-card">
              <div class="recipe-slide-card-img" style="background-image: url('./recipe-images/pasta.jpg');"></div>
              <h3>Creamy Pasta</h3>
            </div>
          </li>

          <li class="glide__slide">
            <div class="recipe-slide-card">
              <div class="recipe-slide-card-img" style="background-image: url('./recipe-images/burger.jpg');"></div>
              <h3>Cheesy Burger</h3>
            </div>
          </li>

          <li class="glide__slide">
            <div class="recipe-slide-card">
              <div class="recipe-slide-card-img" style="background-image: url('./recipe-images/cake.jpg');"></div>
              <h3>Chocolate Cake</h3>
            </div>
          </li>

          <li class="glide__slide">
            <div class="recipe-slide-card">
              <div class="recipe-slide-card-img" style="background-image: url('./recipe-images/salad.jpg');"></div>
              <h3>Fresh Salad</h3>
            </div>
          </li>

          <li class="glide__slide">
            <div class="recipe-slide-card">
              <div class="recipe-slide-card-img" style="background-image: url('./recipe-images/pizza.jpg');"></div>
              <h3>Homemade Pizza</h3>
            </div>
          </li>

          <li class="glide__slide">
            <div class="recipe-slide-card">
              <div class="recipe-slide-card-img" style="background-image: url('./recipe-images/soup.jpg');"></div>
              <h3>Tomato Soup</h3>
            </div>
          </li>

          <li class="glide__slide">
            <div class="recipe-slide-card">
              <div class="recipe-slide-card-img" style="background-image: url('./recipe-images/tacos.jpg');"></div>
              <h3>Spicy Tacos</h3>
            </div>
          </li>

          <li class="glide__slide">
            <div class="recipe-slide-card">
              <div class="recipe-slide-card-img" style="background-image: url('./recipe-images/pancakes.jpg');"></div>
              <h3>Fluffy Pancakes</h3>
            </div>
          </li>

        </ul>
      </div>

      <div class="glide__arrows" data-glide-el="controls">
        <button class="glide__arrow glide__arrow--left" data-glide-dir="<">prev</button>
        <button class="glide__arrow glide__arrow--right" data-glide-dir=">">next</button>
      </div>
    </div>
  </div>

  <div class="container mt-4">
    <h1 class="text-center">Welcome to StudentEat</h1>
    <p class="text-center">Find simple, affordable recipes for students</p>
  </div>

  <script src="./js/scripts-vendor.min.js"></script>
  <script src="./js/scripts.min.js"></script>
  <script>
    home.init();
  </script>

</body>
</html>
